version: '3.8'

services:
  rabbitmq:
    image: rabbitmq:3.12-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tenantguard-network

  service-a:
    build:
      context: ../service-a
      dockerfile: Dockerfile
    container_name: service-a
    ports:
      - "8081:8081"
    environment:
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - tenantguard-network

  service-b:
    build:
      context: ../service-b
      dockerfile: Dockerfile
    container_name: service-b
    ports:
      - "8082:8081"
    environment:
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      TENANTGUARD_FAULT_MODE: "${TENANTGUARD_FAULT_MODE:-NONE}"
      TENANTGUARD_DETECTOR_MODE: "${TENANTGUARD_DETECTOR_MODE:-VERIFIER}"
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - tenantguard-network

networks:
  tenantguard-network:
    driver: bridge